name: Validate Armored Bus Stop

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline game script syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text()
          match = re.search(r'<script>\s*(.*?)\s*</script>', text, re.S)
          if not match:
              raise SystemExit('inline game script missing')
          Path('/tmp/armored-bus-stop.js').write_text(match.group(1))
          PY
          node --check /tmp/armored-bus-stop.js
